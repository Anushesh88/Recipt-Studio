# Render's free backend sleeps after 15 quiet minutes and then takes about a
# minute to answer. This visits /health as a backup to an uptime monitor
# (UptimeRobot, every 5 minutes; see DEPLOY.md): GitHub runs scheduled jobs
# late, often hours apart, so it can't keep the server awake on its own.
# A slow wake-up is only a warning, so it doesn't send failure emails; the
# uptime monitor is what reports real outages.
name: Keep the backend awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Visit /health
        env:
          # Repository variable BACKEND_URL overrides the default
          BACKEND_URL: ${{ vars.BACKEND_URL || 'https://recipt-studio.onrender.com' }}
        # A sleeping server answers 502 for up to a minute while it wakes, so
        # keep trying for about three minutes before calling it a failure
        run: |
          if curl --fail --silent --show-error --retry 8 --retry-delay 20 --retry-all-errors --max-time 60 "$BACKEND_URL/health"; then
            echo "Awake."
          else
            echo "::warning::The backend didn't answer within about 3 minutes (still waking up, or down). The uptime monitor reports real outages."
          fi
