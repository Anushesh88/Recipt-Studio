# Render's free backend sleeps after 15 quiet minutes and then takes about a
# minute to answer. This visits /health every 10 minutes so it stays awake.
# One always-on service uses about 744 of Render's 750 free hours a month.
# (GitHub may run scheduled jobs a few minutes late, and pauses them after
# 60 days without commits; the Actions tab can turn it back on.)
name: Keep the backend awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Visit /health
        env:
          # Repository variable BACKEND_URL overrides the default
          BACKEND_URL: ${{ vars.BACKEND_URL || 'https://recipt-studio.onrender.com' }}
        run: curl --fail --silent --show-error --retry 3 --retry-delay 10 --max-time 90 "$BACKEND_URL/health"
