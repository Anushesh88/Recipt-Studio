[project]
name = "receipt-studio-backend"
version = "0.1.0"
description = "Receipt Studio Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.1",
    "sqlalchemy>=2.0.30",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",  # driver for the default local-dev DATABASE_URL (sqlite+aiosqlite)
    "alembic>=1.13.1",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "pydantic[email]>=2.7.4",
    "pydantic-settings>=2.3.4",
    "weasyprint>=62.2",
    "pymupdf>=1.24.5",
    "segno>=1.6.1",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.9",
    "bcrypt<4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.7",
    "ruff>=0.4.8",
    "mypy>=1.10.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
strict = true
exclude = ["alembic"]

[[tool.mypy.overrides]]
# WeasyPrint ships no type information
module = ["weasyprint", "weasyprint.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 88

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Security", "Depends", "Security"]

[tool.setuptools.packages.find]
# app is a package tree (app.core, app.api, ...); find them all, not just "app"
include = ["app*"]
